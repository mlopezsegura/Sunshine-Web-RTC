<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebRTC TV E2E</title></head>
<body>
<video id="video" autoplay muted playsinline></video>
<script>
const params = new URLSearchParams(location.search);
const wsUrl = params.get("ws");
const pin = params.get("pin");
const codec = params.get("codec") || "h264";
const width = Number(params.get("width") || 1280);
const height = Number(params.get("height") || 720);
const bitrate = Number(params.get("bitrate") || 12000);
const fps = Number(params.get("fps") || 60);
const hdr = params.get("hdr") === "1";
const takeover = params.get("takeover") === "1";
// Seconds of glass-to-glass measurement against clock.html; 0 skips it.
const latencySeconds = Number(params.get("latency") || 0);
// What the TV app does to its receiver: no lip sync, shortest jitter buffer.
const tvTweaks = params.get("tvTweaks") !== "0";
const log = [];
const result = { codec, width, height, fps, hdr, steps: [], errors: [] };
const t0 = performance.now();
function note(step, extra) {
  const entry = { t: Math.round(performance.now() - t0), step, ...(extra || {}) };
  result.steps.push(entry);
}
async function finish() {
  result.log = log.slice(-80);
  await fetch("/result", { method: "POST", body: JSON.stringify(result) });
}
setTimeout(() => { result.errors.push("timeout"); finish(); }, 60000 + latencySeconds * 1000);

let ws, pc, sessionId, control, gamepad, phase = "auth", credentials = null, appId = null;
const send = (m) => { log.push(">> " + m.type); ws.send(JSON.stringify(Object.assign({ version: 2 }, m))); };

async function hmacHex(secretHex, text) {
  const key = await crypto.subtle.importKey("raw", new Uint8Array(secretHex.match(/../g).map(h => parseInt(h, 16))),
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(text));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onmessage = async (event) => {
    const m = JSON.parse(event.data);
    log.push("<< " + m.type + (m.state ? ":" + m.state : "") + (m.code ? ":" + m.code : ""));
    try { await handle(m); } catch (e) { result.errors.push(String(e)); finish(); }
  };
  ws.onclose = () => { log.push("ws closed"); if (phase === "reconnect") { phase = "auth2"; connect(); } };
}

async function handle(m) {
  if (m.type === "auth-required") {
    note("auth-required", { sunshineAvailable: m.sunshineAvailable, mac: m.macAddress || null, pairing: m.pairing || null });
    if (credentials) {
      send({ type: "authenticate", clientId: credentials.clientId,
             proof: await hmacHex(credentials.clientSecret, "moonlight-webrtc-tv-auth-v1:" + m.nonce) });
    } else {
      // An unauthenticated request must be refused before pairing.
      send({ type: "get-apps" });
      send({ type: "pair-client", pin, clientName: "E2E Edge" });
      send({ type: "request-pairing", pin, clientName: "E2E Edge" });
    }
  } else if (m.type === "error") {
    note("error", { requestType: m.requestType, code: m.code });
    // Like the TV, ask again after the Web UI rejects or cancels the request.
    if (m.requestType === "request-pairing" && !credentials) {
      send({ type: "request-pairing", pin, clientName: "E2E Edge" });
    }
    if (m.requestType === "start-session") {
      result.errors.push("start-session refused: " + (m.message || m.code));
      finish();
    }
  } else if (m.type === "paired") {
    note("paired");
    credentials = { clientId: m.clientId, clientSecret: m.clientSecret };
  } else if (m.type === "authenticated") {
    note("authenticated");
  } else if (m.type === "gateway-status") {
    note("gateway-status", { name: m.gatewayName, detected: m.sunshineDetected, paired: m.sunshinePaired, running: m.runningAppId || null });
  } else if (m.type === "capabilities") {
    note("capabilities", { codecs: m.codecs, hdr4k: m.videoModes.find(v => v.width === 3840).hdrCodecs });
  } else if (m.type === "session-status" && m.state === "idle" && phase === "auth") {
    // Reconnect once to prove the issued credentials authenticate a new connection.
    phase = "reconnect";
    ws.close();
  } else if (m.type === "session-status" && m.state === "idle" && phase === "auth2") {
    phase = "apps";
    send({ type: "get-apps" });
  } else if (m.type === "apps") {
    note("apps", { titles: m.apps.map(a => a.title + "#" + a.id + (a.running ? "*" : "")) });
    if (phase !== "apps") return;
    const app = m.apps.find(a => a.title === "Desktop") || m.apps[0];
    appId = app.id;
    phase = "artwork";
    send({ type: "get-app-artwork", appId });
  } else if (m.type === "app-artwork") {
    note("app-artwork", { available: m.available, mime: m.mimeType || null, bytes: m.data ? Math.floor(m.data.length * 3 / 4) : 0 });
    if (phase !== "artwork") return;
    phase = "start";
    send({ type: "start-session", appId,
           video: { width, height, fps, codec, bitrateKbps: bitrate, hdr }, audio: { channels: 2 } });
  } else if (m.type === "session-status") {
    note("session-" + m.state, m.message ? { message: m.message } : undefined);
    if (m.sessionId) sessionId = m.sessionId;
    if (m.state === "streaming") setTimeout(latencySeconds > 0 ? measureLatency : measure, latencySeconds > 0 ? 3000 : 8000);
    if (m.state === "error") { result.errors.push("session error: " + m.message); finish(); }
    if (m.state === "idle" && phase === "stopping") {
      phase = "host-stop";
      send({ type: "stop-host-session" });
    }
  } else if (m.type === "host-session-status") {
    note("host-" + m.state, { running: m.runningAppId || null });
    if (m.state === "stopped" || m.state === "failed") finish();
  } else if (m.type === "offer") {
    note("offer", { imageattr: /a=imageattr:96 send/.test(m.sdp), rtpmap: (m.sdp.match(/a=rtpmap:96 [^\r]+/) || [""])[0],
      playoutDelay: /a=extmap:\d+ http:\/\/www\.webrtc\.org\/experiments\/rtp-hdrext\/playout-delay/.test(m.sdp) });
    pc = new RTCPeerConnection();
    pc.onicecandidate = (e) => { if (e.candidate) send({ type: "candidate", sessionId, candidate: e.candidate.candidate, mid: e.candidate.sdpMid }); };
    pc.ontrack = (e) => {
      if (e.track.kind !== "video") return;
      if (tvTweaks && "jitterBufferTarget" in e.receiver) e.receiver.jitterBufferTarget = 0;
      document.getElementById("video").srcObject = new MediaStream([e.track]);
    };
    pc.ondatachannel = (e) => {
      const channel = e.channel;
      if (channel.label === "control") {
        control = channel;
        channel.onmessage = (x) => log.push("ctl " + x.data.slice(0, 90));
        channel.onopen = () => {
          note("control-open");
          channel.send(JSON.stringify({ v: 2, type: "gamepad-connected", controllerId: 1, id: "Xbox Wireless Controller (STANDARD GAMEPAD Vendor: 045e Product: 0b13)", mapping: "standard", buttons: 17, axes: 4, dualRumble: true, triggerRumble: false }));
        };
      } else if (channel.label === "gamepad") {
        gamepad = channel;
        channel.onopen = () => note("gamepad-open");
      }
    };
    pc.onconnectionstatechange = () => note("pc-" + pc.connectionState);
    await pc.setRemoteDescription({ type: "offer", sdp: tvTweaks ? separateAudioSync(m.sdp) : m.sdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type: "answer", sessionId, sdp: pc.localDescription.sdp });
  } else if (m.type === "candidate") {
    if (pc) await pc.addIceCandidate({ candidate: m.candidate, sdpMid: m.mid });
  }
}

// Same as tizen/low-latency.js: audio in a stream of its own, so the video is not held for it.
function separateAudioSync(sdp) {
  let inAudio = false;
  const rename = (stream) => (stream === "-" || stream.endsWith("-audio") ? stream : stream + "-audio");
  return sdp.split("\r\n").map((line) => {
    if (line.startsWith("m=")) { inAudio = line.startsWith("m=audio"); return line; }
    if (!inAudio) return line;
    return line.replace(/^(a=msid:)(\S+)/, (m, p, s) => p + rename(s)).replace(/^(a=ssrc:\d+ msid:)(\S+)/, (m, p, s) => p + rename(s));
  }).join("\r\n");
}

async function videoStats() {
  const out = {};
  (await pc.getStats()).forEach((s) => {
    if (s.type === "inbound-rtp" && s.kind === "video") out.video = s;
    if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") out.rtt = s.currentRoundTripTime;
  });
  return out;
}

function percentile(sorted, share) {
  return sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * share))] : null;
}

// Reads clock.html's row of cells back from every presented frame: white and black references,
// then 24 bits of the wall clock in milliseconds. Same machine, same clock.
async function measureLatency() {
  const video = document.getElementById("video");
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d", { willReadFrequently: true });
  const samples = [];
  const toScreen = [];
  let unreadable = 0;
  const startStats = await videoStats();
  const ends = performance.now() + latencySeconds * 1000;
  await new Promise((resolve) => {
    const onFrame = (now, metadata) => {
      const cell = video.videoHeight / 27;
      canvas.width = Math.ceil(cell * 26);
      canvas.height = Math.ceil(cell);
      context.drawImage(video, 0, 0, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      const luma = (index) => {
        const x = Math.floor(cell * (index + 0.5));
        const y = Math.floor(cell * 0.5);
        const offset = (y * canvas.width + x) * 4;
        return pixels[offset] * 0.299 + pixels[offset + 1] * 0.587 + pixels[offset + 2] * 0.114;
      };
      const white = luma(0);
      const black = luma(1);
      if (!result.debugFrame) {
        const full = document.createElement("canvas");
        full.width = 480;
        full.height = Math.round(480 * video.videoHeight / video.videoWidth);
        full.getContext("2d").drawImage(video, 0, 0, full.width, full.height);
        result.debugFrame = { white, black, videoWidth: video.videoWidth, videoHeight: video.videoHeight, png: full.toDataURL("image/png") };
      }
      const shownAt = Date.now() - (performance.now() - (metadata.expectedDisplayTime || now));
      if (white - black > 100) {
        const threshold = (white + black) / 2;
        let value = 0;
        for (let bit = 0; bit < 24; bit += 1) value = (value << 1) | (luma(bit + 2) > threshold ? 1 : 0);
        const elapsed = ((Math.round(shownAt) & 0xffffff) - value + 0x1000000) % 0x1000000;
        if (elapsed < 2000) samples.push(elapsed); else unreadable += 1;
      } else {
        unreadable += 1;
      }
      if (metadata.receiveTime) toScreen.push((metadata.expectedDisplayTime || now) - metadata.receiveTime);
      if (performance.now() < ends) video.requestVideoFrameCallback(onFrame); else resolve();
    };
    video.requestVideoFrameCallback(onFrame);
  });
  const endStats = await videoStats();
  const a = startStats.video || {};
  const b = endStats.video || {};
  const per = (total, count) => (b[count] - a[count]) > 0 ? Math.round(1000 * (b[total] - a[total]) / (b[count] - a[count]) * 100) / 100 : null;
  const sorted = samples.slice().sort((x, y) => x - y);
  const mean = (list) => list.length ? Math.round(list.reduce((sum, x) => sum + x, 0) / list.length * 10) / 10 : null;
  result.latency = {
    frames: samples.length, unreadable,
    meanMs: mean(samples), p50Ms: percentile(sorted, 0.5), p95Ms: percentile(sorted, 0.95), p99Ms: percentile(sorted, 0.99),
    minMs: sorted.length ? sorted[0] : null, maxMs: sorted.length ? sorted[sorted.length - 1] : null,
    arrivalToScreenMs: mean(toScreen),
    jitterBufferMs: per("jitterBufferDelay", "jitterBufferEmittedCount"),
    decodeMs: per("totalDecodeTime", "framesDecoded"),
    rttMs: endStats.rtt != null ? Math.round(endStats.rtt * 10000) / 10 : null,
    decodedFps: Math.round((b.framesDecoded - a.framesDecoded) / latencySeconds * 10) / 10,
    packetsLost: (b.packetsLost || 0) - (a.packetsLost || 0),
    decoder: b.decoderImplementation,
  };
  note("latency-measured");
  phase = "stopping";
  send({ type: "stop-session" });
}

async function measure() {
  // Neutral gamepad snapshots exercise the unreliable channel without pressing anything.
  for (let seq = 1; seq <= 20; seq++) {
    if (gamepad && gamepad.readyState === "open") {
      gamepad.send(JSON.stringify({ v: 2, type: "gamepad-state", controllerId: 1, seq, timestampMs: performance.now(), buttons: 0,
        leftTrigger: 0, rightTrigger: 0, leftStickX: 0, leftStickY: 0, rightStickX: 0, rightStickY: 0 }));
    }
  }
  const sample = async () => {
    const stats = await pc.getStats();
    const out = {};
    stats.forEach((s) => {
      if (s.type === "inbound-rtp" && s.kind === "video") {
        out.video = { framesDecoded: s.framesDecoded, framesReceived: s.framesReceived, framesDropped: s.framesDropped, keyFramesDecoded: s.keyFramesDecoded,
          frameWidth: s.frameWidth, frameHeight: s.frameHeight, fps: s.framesPerSecond, bytes: s.bytesReceived, packetsLost: s.packetsLost,
          nack: s.nackCount, pli: s.pliCount, decoder: s.decoderImplementation,
          jitterBufferMs: s.jitterBufferEmittedCount ? Math.round(1000 * s.jitterBufferDelay / s.jitterBufferEmittedCount * 10) / 10 : null,
          decodeMs: s.framesDecoded ? Math.round(1000 * s.totalDecodeTime / s.framesDecoded * 100) / 100 : null };
      }
      if (s.type === "inbound-rtp" && s.kind === "audio") {
        out.audio = { packets: s.packetsReceived, lost: s.packetsLost, bytes: s.bytesReceived };
      }
      if (s.type === "codec") { (out.codecs = out.codecs || []).push(s.mimeType + (s.sdpFmtpLine ? " " + s.sdpFmtpLine : "")); }
      if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") out.rttMs = s.currentRoundTripTime * 1000;
    });
    return out;
  };
  const first = await sample();
  await new Promise(r => setTimeout(r, 2000));
  const second = await sample();
  result.stats = second;
  if (first.video && second.video) {
    result.measuredFps = (second.video.framesDecoded - first.video.framesDecoded) / 2;
    result.measuredKbps = Math.round((second.video.bytes - first.video.bytes) * 8 / 2 / 1000);
  }
  note("measured");
  if (takeover) {
    takeOver();
    return;
  }
  phase = "stopping";
  send({ type: "stop-session" });
}

// The same TV reconnecting mid-stream, as after a network drop, must replace the streaming
// connection and end its stream; the new connection then stops the application.
function takeOver() {
  phase = "takeover";
  ws.onclose = () => note("replaced-connection-closed");
  const second = new WebSocket(wsUrl);
  second.onmessage = async (event) => {
    const m = JSON.parse(event.data);
    log.push("<<2 " + m.type + (m.state ? ":" + m.state : ""));
    if (m.type === "auth-required") {
      second.send(JSON.stringify({ version: 2, type: "authenticate", clientId: credentials.clientId,
        proof: await hmacHex(credentials.clientSecret, "moonlight-webrtc-tv-auth-v1:" + m.nonce) }));
    } else if (m.type === "session-status" && m.state === "idle") {
      note("takeover-idle");
      second.send(JSON.stringify({ version: 2, type: "stop-host-session" }));
    } else if (m.type === "host-session-status") {
      note("host-" + m.state, { running: m.runningAppId || null });
      if (m.state === "stopped" || m.state === "failed") finish();
    }
  };
}

connect();
</script>
</body>
</html>
